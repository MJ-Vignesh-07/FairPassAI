# Render Infrastructure as Code Blueprint
# FairPass AI — Anti-Scalping & Smart Ticketing Platform
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: fairpass-db
    databaseName: ticketing_db
    user: fairpass_user
    plan: free
    postgresMajorVersion: "16"

services:
  # 1. Backend Web Service (Flask + Gunicorn + Scikit-Learn Anti-Scalping Engine)
  - type: web
    name: fairpass-backend
    runtime: python
    plan: free
    rootDir: smart-ticketing-backend/smart-ticketing-backend
    buildCommand: pip install -r requirements.txt
    startCommand: python init_db.py && gunicorn run:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fairpass-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9

  # 2. Frontend Static Site (React 19 / Vite SPA)
  - type: web
    name: fairpass-frontend
    runtime: static
    rootDir: smart-ticketing-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://fairpass-backend.onrender.com

